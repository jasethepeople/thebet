<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e11">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://uechkunlijbtkufubxdo.supabase.co wss://uechkunlijbtkufubxdo.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'self'">
<meta http-equiv="X-Frame-Options" content="DENY">
<title>The Bet</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/chip-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/chip-192.png">
<link rel="apple-touch-icon" href="assets/chip-180.png">
<meta property="og:title" content="The Bet — bragging rights for your friend group">
<meta property="og:description" content="Crew betting with play-money BB. 18+.">
<meta property="og:image" content="assets/chip-512.png">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#16140f;--mut:#6b665a;--acc:#e5481f;--ok:#1f9d55;--no:#c0262d;--line:#e2ddd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11;--card:#18181d;--ink:#f3f1ea;--mut:#9a968a;--acc:#ff5a2c;--ok:#3ddc84;--no:#ff5c63;--line:#2a2a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.5px}h1 b{color:var(--acc)}h2{font-size:18px;margin:18px 0 8px}
.sub{color:var(--mut);font-size:14px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 8px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;background:var(--acc);color:#fff;cursor:pointer}
button.g{background:var(--line);color:var(--ink)}button.y{background:var(--ok)}button.n{background:var(--no)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.tag{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.q{font-size:18px;font-weight:700;margin:4px 0 8px}
.bar{height:8px;border-radius:5px;background:var(--no);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 2px;font-size:13px}nav button.on{color:var(--acc)}
.share{background:linear-gradient(135deg,#e5481f 0%,#b0337a 55%,#241046 100%);color:#fff;border-radius:16px;padding:18px;margin:8px 0;position:relative;overflow:hidden}
.share .q{color:#fff;position:relative}
.share .wm{position:absolute;right:-38px;bottom:-38px;width:190px;opacity:.5;pointer-events:none}
.bigres{font-size:42px;font-weight:900;letter-spacing:-1px;line-height:1;margin:6px 0;position:relative}
.pill{display:inline-block;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:800;letter-spacing:1px}
.win{font-size:22px;font-weight:900;color:#ffe082;margin-top:8px;position:relative}
.lb{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.wheel{font-size:20px;font-weight:800;text-align:center;padding:24px 10px;min-height:96px}
li{margin-bottom:6px}a{color:var(--acc)}
.propill{display:inline-block;background:linear-gradient(135deg,#e5481f,#7b1fa2);color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;border-radius:20px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.paywall{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.paywall>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center}
.paywall h3{margin:0 0 6px;font-size:20px}
</style></head>
<body><main id="app"></main><nav id="nav"></nav>
<script src="vendor/supabase.min.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="app.js"></script>
</body></html>
